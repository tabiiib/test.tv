name: Update IPTV Playlist, Logos, Allowlist & EPG

on:
  schedule:
    # Runs automatically every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-iptv-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: 1. Validate streams & build clean-playlist.m3u
        run: python scripts/check_streams.py

      - name: 2. Pre-compile channels.min.json
        run: python scripts/build_json.py

      - name: 3. Mirror & optimize channel logos (96x96)
        run: python scripts/sync_logos.py

      - name: 4. Generate domain allowlist for /api/proxy
        run: python scripts/generate_allowlist.py

      - name: 5. Fetch & slim 6-hour EPG guide
        run: python scripts/fetch_epg.py

      - name: Commit updated IPTV assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ logos/
          git diff --staged --quiet || git commit -m "chore: auto-update clean playlist, JSON, logos, allowlist & EPG"
          git push
