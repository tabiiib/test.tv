  <style>

    body {

    /* YouTube Dark Top Masthead */

    .net-telemetry {

    .channel-count {

      -webkit-justify-content: space-between;

      align-items: center;

    .channel-list {
      -webkit-flex: 1;
      flex: 1;
      min-height: 0;

    .channel-list::-webkit-scrollbar {

    .channel-list::-webkit-scrollbar-thumb {

    /* YouTube-Style Clean Feed Cards */
    .channel-card {
      width: 48.5%;
      width: calc(50% - 5px);
      margin-bottom: 8px;
      display: -webkit-inline-flex;

    .channel-card:nth-child(odd) {

    }

    .channel-card:hover,
    .channel-card:focus {
      background: #272727;

    }

    .channel-card.active {
      background: #262626;

    /* Rounded-Rectangle Video-Thumbnail Style Logo Box */
    .channel-card img {
      width: 72px;
      height: 48px;
      object-fit: contain;
      border-radius: 8px;

    .channel-info {

    .channel-name {

    .fav-btn {

<body>

  <header>
    <div class="brand">IPTV</div>
    <div class="net-telemetry" id="netTelemetry" title="Live Speed & Data Counter (Click to reset)">
      <span class="net-val" id="netSpeedVal">0.0 Mbps</span>
      <span class="net-sep">•</span>
      <span class="net-val" id="netDataVal">0.0 MB</span>
    </div>
    <div class="brand-name">TABIB</div>
  </header>

  <div class="main-container">
    <section class="player-section" id="playerSection">
      <div class="video-stage" id="videoStage">
        <div class="video-frame" id="videoFrame">
          <video id="videoPlayer" controls playsinline webkit-playsinline autoplay></video>
        </div>
      </div>
      <div class="now-playing-bar">
        <div class="channel-meta" id="nowPlayingBox">
          <img id="currentLogo" src="https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/btv-national-2db28e10.png" alt="Logo" />
          <div style="min-width:0;">
            <div class="now-playing-title" id="currentTitle">Loading Channels...</div>
            <div class="now-playing-sub" id="currentCategory">Bangladesh</div>
          </div>
        </div>
        <div class="player-controls-right">
          <button class="secondary" id="prevChBtn" title="Previous Channel">◀ Prev</button>
          <button class="secondary" id="nextChBtn" title="Next Channel">Next ▶</button>
          <select class="quality-select" id="qualitySelect" title="Select Video Quality / Mode">
            <option value="smart-auto" selected>Auto (All Modes)</option>
            <option value="hw">HW Native</option>
            <option value="mse-auto">ABR Auto (MSE)</option>
            <option value="cap-720">720p Cap (MSE)</option>
            <option value="cap-480">480p Cap (Smooth)</option>
          </select>
          <button class="secondary" id="fullDisplayBtn" title="Full Display / Fullscreen">⛶ Full</button>
          <span class="status-badge" id="streamStatus">Idle</span>
        </div>
      </div>
    </section>

    <aside class="sidebar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search channels..." />
        <button type="button" class="secondary clear-search-btn" id="clearSearchBtn" title="Clear search">Clear</button>
        <button type="button" class="secondary fav-search-btn" id="favFilterBtn" title="Show Favourite Channels">Favourites</button>
      </div>
      <div class="category-tabs" id="categoryTabs"></div>
      <div class="channel-count">
        <span id="activeCategoryLabel">Bangladesh</span>
        <span id="channelCount">0 channels</span>
      </div>
      <div class="channel-list" id="channelList"></div>
    </aside>
  </div>

  <script>
    (function () {
      var DEFAULT_M3U_URL = "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/IPTV-Playlist.m3u";
      var ACTIVE_M3U_URL = DEFAULT_M3U_URL;
      try {
        var qs = window.location.search || "";
        var m3uParamMatch = qs.match(/[?&]m3u=([^&]+)/i);
        if (m3uParamMatch && m3uParamMatch[1]) {
          var decodedM3u = decodeURIComponent(m3uParamMatch[1]).replace(/^\s+|\s+$/g, "");
          if (/^https?:\/\//i.test(decodedM3u)) {
            ACTIVE_M3U_URL = decodedM3u;
          }
        }
      } catch (e) {}
      var FALLBACK_LOGO = "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/btv-national-2db28e10.png";
      var STORAGE_LAST_URL = "iptv_first_last_ch_v1";
      var STORAGE_PLAYLIST_CACHE = "iptv_m3u_cache_v1";
      var STORAGE_HTTP_PROXY_BUDGET = "iptv_http_proxy_bytes_v1";
      var HTTP_PROXY_MONTHLY_CAP_BYTES = 5368709120; // 5 GB safety cap out of Vercel's 10 GB monthly limit
      var BATCH_SIZE = 24;

      var BUILTIN_CHANNELS = [

      function normalizeChannelTitle(str) {
        return (" " + String(str || "").toLowerCase().replace(/[^a-z0-9&]+/g, " ") + " ").replace(/\s+/g, " ");
      }

      /* Score stream TV playability on LG webOS / Safari:
         - Standard HLS (.m3u8) plays natively in TV Hardware
         - Non-HLS / raw TS / PHP / tokenless dead patterns or blocked geo-UK/US mirrors score lower
         - Clean primary channel names (without "UK", "USA", "Backup 2", "Low") score higher */
      function scoreTvPlayability(ch) {
        var url = String(ch.url || "").toLowerCase();
        var name = String(ch.name || "").toLowerCase();
        var score = 0;

        if (!url || url.indexOf("http") !== 0) return -999;

        // Strongly prefer standard HLS (.m3u8) for TV hardware decoder
        if (url.indexOf(".m3u8") !== -1) {
          score += 50;
        } else if (url.indexOf(".mpd") !== -1 || url.indexOf("rtmp://") === 0) {
          score -= 80; // DASH/RTMP do not play in native HTML5 video on LG TV
        }

        // Prefer reliable BDIX / CDN hosts present in the playlist
        if (url.indexOf("aynaott.com") !== -1 || url.indexOf("gpcdn.net") !== -1 || url.indexOf("sunplex.live") !== -1 || url.indexOf("pages.dev") !== -1) {
          score += 25;
        }

        // HTTPS streams avoid mixed-content overhead
        if (url.indexOf("https://") === 0) {
          score += 8;
        }

        // Penalize regional diaspora variants when matching main channels (e.g. "ATN Bangla UK", "NTV Europe")
        if (name.indexOf(" uk") !== -1 || name.indexOf(" usa") !== -1 || name.indexOf(" europe") !== -1 || name.indexOf(" canada") !== -1) {
          score -= 18;
        }

        // Slight bonus for HD / FHD feeds
        if (name.indexOf(" hd") !== -1 || name.indexOf(" fhd") !== -1) {
          score += 5;
        }

        // Strongly prefer channels categorized under Bangladesh
        var grp = String(ch.group || "").toLowerCase();
        if (grp.indexOf("bangladesh") !== -1) {
          score += 35;
        }

        // Prefer shorter, canonical channel titles over long noisy labels
        score -= Math.min(15, Math.floor(name.length / 4));
        return score;
      }

          qualitySelect.appendChild(cap720Opt);

          var cap480Opt = document.createElement("option");
          cap480Opt.value = "cap-480";
          cap480Opt.textContent = "480p Cap (Smooth)";
          qualitySelect.appendChild(cap480Opt);
        }

        if (levels && levels.length > 0 && typeof Hls !== "undefined" && Hls.isSupported()) {
          var sorted = [];
          for (var i = 0; i < levels.length; i++) {
            sorted.push({ index: i, height: levels[i].height || 0, bitrate: levels[i].bitrate || 0 });
          }
          sorted.sort(function (a, b) {
            return (b.height - a.height) || (b.bitrate - a.bitrate);
          });

          for (var j = 0; j < sorted.length; j++) {
            var lvl = sorted[j];
            var opt = document.createElement("option");
            opt.value = "level-" + lvl.index;
            var kbps = lvl.bitrate ? " (" + Math.round(lvl.bitrate / 1000) + "k)" : "";
            opt.textContent = (lvl.height ? lvl.height + "p" : "Stream " + (lvl.index + 1)) + kbps;
            qualitySelect.appendChild(opt);
          }
        }

        if (preferredQualityMode === "smart-auto") {
          qualitySelect.value = "smart-auto";
        } else if (isHwMode || preferredQualityMode === "hw") {
          qualitySelect.value = "hw";
        } else if (preferredQualityMode === "cap-720" || preferredQualityMode === "cap-480") {
          qualitySelect.value = preferredQualityMode;
        } else if (hls && hls.currentLevel >= 0 && !hls.autoLevelEnabled) {
          qualitySelect.value = "level-" + hls.currentLevel;
        } else {
          qualitySelect.value = "mse-auto";
        }
      }

      qualitySelect.addEventListener("change", function () {
        var val = qualitySelect.value;
        if (!activeChannelObj) return;

        if (val === "smart-auto") {
          preferredQualityMode = "smart-auto";
          try { localStorage.setItem(STORAGE_DEFAULT_QUALITY, "smart-auto"); } catch (e) {}
          clearSavedChannelMode(activeChannelObj.url);
          activeAutoChainMode = true;
          advanceAutoFallback(activeChannelObj, 0);
          return;
        }

        if (val === "hw") {
          preferredQualityMode = "hw";
          try { localStorage.setItem(STORAGE_DEFAULT_QUALITY, "hw"); } catch (e) {}
          activeAutoChainMode = false;
          var needHttpHw = (window.location.protocol === "https:" && isHttpOnlyStream(activeChannelObj.url));
          startHardwarePlayback(getPlayableUrl(activeChannelObj.url, needHttpHw, needHttpHw), activeChannelObj, needHttpHw, 0, false, 0, "hw-direct");
          return;
        }

        if (val === "cap-720" || val === "cap-480") {
          preferredQualityMode = val;
          try { localStorage.setItem(STORAGE_DEFAULT_QUALITY, val); } catch (e) {}
          activeAutoChainMode = false;
          var maxH = val === "cap-480" ? 480 : 720;
          var needHttpProxy = (window.location.protocol === "https:" && isHttpOnlyStream(activeChannelObj.url));
          if (currentEngineMode !== "mse" || !hls) {
            currentEngineMode = "mse";
            startMseFallbackPlayback(getPlayableUrl(activeChannelObj.url, needHttpProxy, needHttpProxy), activeChannelObj, needHttpProxy, -1, maxH, false, 0, val);
          } else {
            var targetIdx = pickBestLevelForCap(hls.levels, maxH);
            hls.autoLevelCapping = targetIdx;
            hls.currentLevel = targetIdx;
            var pickedH = (hls.levels && hls.levels[targetIdx] && hls.levels[targetIdx].height) ? hls.levels[targetIdx].height + "p" : maxH + "p";
            setStatus("Live (" + pickedH + " Cap)", "ok");
          }
          return;
        }

        if (val === "mse-auto") {
          preferredQualityMode = "mse-auto";
          try { localStorage.setItem(STORAGE_DEFAULT_QUALITY, "mse-auto"); } catch (e) {}
          activeAutoChainMode = false;
          var needHttpProxyAuto = (window.location.protocol === "https:" && isHttpOnlyStream(activeChannelObj.url));
          if (currentEngineMode !== "mse" || !hls) {
            currentEngineMode = "mse";
            startMseFallbackPlayback(getPlayableUrl(activeChannelObj.url, needHttpProxyAuto, needHttpProxyAuto), activeChannelObj, needHttpProxyAuto, -1, 0, false, 0, "mse-direct");
          } else {
            hls.autoLevelCapping = -1;
            hls.currentLevel = -1;
            setStatus("Live (ABR Auto)", "ok");
          }
          return;
        }

        if (val.indexOf("level-") === 0) {
          activeAutoChainMode = false;
          var targetLvl = parseInt(val.replace("level-", ""), 10);
          if (currentEngineMode !== "mse" || !hls) {
            currentEngineMode = "mse";
            startMseFallbackPlayback(getPlayableUrl(activeChannelObj.url, false), activeChannelObj, false, targetLvl, 0, false, 0, "mse-locked");
          } else {
            hls.autoLevelCapping = -1;
            hls.currentLevel = targetLvl;
            var h = (hls.levels && hls.levels[targetLvl] && hls.levels[targetLvl].height) ? hls.levels[targetLvl].height + "p" : "Locked";
            setStatus("Live (" + h + ")", "ok");
          }
        }
      });

      function parseM3U(m3uText) {
        var lines = m3uText.split(/\r?\n/);
        var parsed = [];
        var currentInfo = null;

        for (var i = 0; i < lines.length; i++) {
          var line = lines[i].replace(/^\s+|\s+$/g, "");
          if (!line) continue;

          if (line.indexOf("#EXTINF:") === 0) {
            var logoMatch = line.match(/tvg-logo="([^"]*)"/i);
            var groupMatch = line.match(/group-title="([^"]*)"/i);
            var commaIdx = line.lastIndexOf(",");
            var name = commaIdx !== -1 ? line.substring(commaIdx + 1).replace(/^\s+|\s+$/g, "") : "Channel";

            currentInfo = {
              name: name || "Channel",
              logo: (logoMatch && logoMatch[1]) ? logoMatch[1] : FALLBACK_LOGO,
              group: (groupMatch && groupMatch[1]) ? groupMatch[1] : "Others"
            };
          } else if (line.charAt(0) !== "#" && currentInfo) {
            var isHttpLink = (line.toLowerCase().indexOf("http://") === 0);
            parsed.push({
              num: parsed.length + 1,
              name: currentInfo.name,
              logo: currentInfo.logo,
              group: currentInfo.group,
              url: line,
              isHttpOnly: isHttpLink
            });
            currentInfo = null;
          }
        }
        return parsed;
      }

      function buildCategoryTabs() {
        var rawGroups = [];
        var hasHttpChannels = false;
        for (var i = 0; i < channels.length; i++) {
          if (channels[i].isHttpOnly) {

            continue;
          }
          if (rawGroups.indexOf(channels[i].group) === -1) {
            rawGroups.push(channels[i].group);
          }
        }

        var usedGroups = {};
        var kidsGroups = [];
        var docGroups = [];
        var religiousGroups = [];
        var sportsGroups = [];
        var remaining = [];

        for (var g = 0; g < rawGroups.length; g++) {
          var grp = rawGroups[g];
          var low = grp.toLowerCase();

          if (low.indexOf("kid") !== -1 || low.indexOf("cartoon") !== -1 || low.indexOf("animation") !== -1) {
            kidsGroups.push(grp);
            usedGroups[grp] = true;
          } else if (
            low.indexOf("documentary") !== -1 ||

            low.indexOf("adventure") !== -1 ||
            low.indexOf("infotainment") !== -1 ||
            low.indexOf("knowledge") !== -1 ||
            low.indexOf("science") !== -1 ||
            low.indexOf("nature") !== -1 ||
            low.indexOf("discovery") !== -1
          ) {
            docGroups.push(grp);
            usedGroups[grp] = true;
          } else if (
            low.indexOf("religio") !== -1 ||
            low.indexOf("islam") !== -1 ||
            low.indexOf("spirit") !== -1 ||
            low.indexOf("devotion") !== -1 ||
            low.indexOf("christian") !== -1 ||
            low.indexOf("hindu") !== -1
          ) {
            religiousGroups.push(grp);
            usedGroups[grp] = true;
          } else if (low.indexOf("sport") !== -1) {
            sportsGroups.push(grp);
            usedGroups[grp] = true;
          }
        }

        for (var r = 0; r < rawGroups.length; r++) {
          if (!usedGroups[rawGroups[r]]) {
            remaining.push(rawGroups[r]);
          }
        }

        var orderedTabs = [

          KOLKATA_TAB_NAME,

        ].concat(kidsGroups, docGroups, religiousGroups, sportsGroups, remaining, ["All"]);

        if (hasHttpChannels) {

        if (activeCategory !== FAVORITES_TAB_NAME && orderedTabs.indexOf(activeCategory) === -1) {
          activeCategory = NEWS_TAB_NAME;
        }

        categoryTabs.innerHTML = "";
        for (var t = 0; t < orderedTabs.length; t++) {
          var groupName = orderedTabs[t];
          var tab = document.createElement("div");
          tab.className = "tab" + (groupName === activeCategory ? " active" : "");
          tab.setAttribute("tabindex", "0");
          tab.setAttribute("data-category", groupName);

      function syncFavButtonState() {
        if (!favFilterBtn) return;

      // Zero-Origin-Transfer Strategy:
      // 1. Direct HTTPS streams load 100% directly from stream CDN (0 bytes on Vercel).
      // 2. For CORS-blocked HTTPS playlists, only the tiny .m3u8 manifest is proxied (&mode=manifest)
      //    while heavy .ts/.m4s video chunks load directly from the stream CDN!
      function isHttpOnlyStream(rawUrl) {
        return String(rawUrl || "").toLowerCase().indexOf("http://") === 0;
      }

      function getPlayableUrl(rawUrl, forceManifestProxy, allowHttpProxy) {
        if (forceManifestProxy) {
          var httpFlag = allowHttpProxy ? "&allowHttp=1" : "";
          return "/api/proxy?mode=manifest" + httpFlag + "&url=" + encodeURIComponent(rawUrl);
        }
        return rawUrl;
      }

      function appendCacheBuster(url) {
        if (url.indexOf("/api/proxy") === 0) return url;
        var sep = url.indexOf("?") === -1 ? "?" : "&";
        return url + sep + "_r=" + Date.now();
      }

      function teardownPlayer() {
        clearInterval(stallWatchdogTimer);
        clearFallbackTimer();
        clearAutoSkipTimer();
        if (hls) {
          try { hls.destroy(); } catch (e) {}
          hls = null;
        }
        video.onloadedmetadata = null;
        video.onplaying = null;
        video.onwaiting = null;
        video.onstalled = null;
        video.onended = null;
        video.onerror = null;
        try {
          video.pause();
          video.removeAttribute("src");
          video.load();
        } catch (e) {}
      }

      function safeVideoPlay() {
        try {
          var playPromise = video.play();
          if (playPromise && typeof playPromise.catch === "function") {
            playPromise.catch(function () {
              video.muted = true;
              try {
                var mutedPromise = video.play();
                if (mutedPromise && typeof mutedPromise.then === "function") {
                  mutedPromise.then(function () {
                    setStatus("Playing (Muted)", "warn");
                  }).catch(function () {
                    setStatus("Tap Video to Play", "warn");
                  });
                }
              } catch (e2) {
                setStatus("Tap Video to Play", "warn");
              }
            });
          }
        } catch (err) {
          setStatus("Tap Video to Play", "warn");
        }
      }

      /* Sequential Multi-Stage Auto-Fallback Chain (Default: HW Native):
         Stage 0: HW Native (Direct)
         Stage 1: HW Native (Proxy)
         Stage 2: 720p Cap (MSE Direct)
         Stage 3: 480p Cap (MSE Proxy)
         Stage 4: ABR Auto (MSE)
         If a stage fails or stalls on boot, it automatically advances to the next stage! */
      var fallbackChainTimer = null;
      var activeAutoChainMode = false;
      var currentFallbackStage = 0;

      function clearFallbackTimer() {
        if (fallbackChainTimer) {
          clearTimeout(fallbackChainTimer);
          fallbackChainTimer = null;
        }
      }

      function buildFallbackStages(channel) {
        var stages = [];
        var isHttpsSite = window.location.protocol === "https:";
        var isHttpStream = isHttpOnlyStream(channel.url);
        var hasMse = (typeof Hls !== "undefined" && Hls.isSupported());

        // On-demand HTTP (BDIX) playback
        if (isHttpsSite && isHttpStream) {
          if (isHttpProxyCapReached()) {
            return stages;
          }
          if (hasMse) {
            stages.push({ key: "http-mse-480", type: "mse", proxy: true, allowHttp: true, cap: 480, label: "HTTP-Proxy 480p" });
            stages.push({ key: "http-mse-auto", type: "mse", proxy: true, allowHttp: true, cap: 0, label: "HTTP-Proxy ABR" });
          }
          if (supportsNativeHls) {
            stages.push({ key: "http-hw", type: "hw", proxy: true, allowHttp: true, label: "HTTP-Proxy HW" });
          }
          return stages;
        }

        // Anti-Buffer Auto-Fallback Pipeline:
        // 1. HW Native (Direct - zero CPU, smooth 60fps when CDN is fast)
        // 2. ABR Auto (MSE Direct with 30s-60s deep buffer & fast-start level 0)
        // 3. 720p Cap (MSE Direct - eliminates 1080p bandwidth spikes)
        // 4. 480p Smooth Cap (MSE Direct - rock-solid on slower/congested links)
        // 5. ABR Auto (M3U8 Manifest Proxy)
        // 6. HW Native (M3U8 Manifest Proxy)
        // 7. 480p Smooth Cap (M3U8 Manifest Proxy)
        if (supportsNativeHls) {
          stages.push({ key: "hw-direct", type: "hw", proxy: false, allowHttp: false, label: "HW Native" });
        }
        if (hasMse) {
          stages.push({ key: "mse-auto", type: "mse", proxy: false, allowHttp: false, cap: 0, label: "ABR Auto" });
          stages.push({ key: "cap-720", type: "mse", proxy: false, allowHttp: false, cap: 720, label: "720p Cap" });
          stages.push({ key: "cap-480", type: "mse", proxy: false, allowHttp: false, cap: 480, label: "480p Smooth" });
          stages.push({ key: "mse-proxy", type: "mse", proxy: true, allowHttp: false, cap: 0, label: "ABR Proxy" });
        }
        if (supportsNativeHls) {
          stages.push({ key: "hw-proxy", type: "hw", proxy: true, allowHttp: false, label: "HW Proxy" });
        }
        if (hasMse) {
          stages.push({ key: "cap-480-proxy", type: "mse", proxy: true, allowHttp: false, cap: 480, label: "480p Proxy" });
        }

        // Prioritize the last smooth winning mode for this channel
        var rememberedKey = getSavedChannelMode(channel.url);
        if (rememberedKey && stages.length > 1) {
          var foundIdx = -1;
          for (var i = 0; i < stages.length; i++) {
            if (stages[i].key === rememberedKey) {
              foundIdx = i;
              break;
            }
          }
          if (foundIdx > 0) {
            var winner = stages.splice(foundIdx, 1)[0];
            stages.unshift(winner);
          }
        }

        return stages;
      }

      var autoSkipHopCount = 0;
      var autoSkipTimer = null;

      function clearAutoSkipTimer() {
        if (autoSkipTimer) {
          clearTimeout(autoSkipTimer);
          autoSkipTimer = null;
        }
      }

      function triggerAutoSkipToNextChannel(failedChannel) {
        if (!activeChannelObj || activeChannelUrl !== failedChannel.url) return;
        clearAutoSkipTimer();
        var list = filteredChannels.length > 0 ? filteredChannels : channels;
        var maxHops = Math.max(1, list.length);

        if (autoSkipHopCount >= maxHops) {
          autoSkipHopCount = 0;
          setStatus("All Channels Offline", "error");
          return;
        }

        autoSkipHopCount++;
        setStatus("Offline • Shifting Next (" + autoSkipHopCount + ")...", "warn");
        autoSkipTimer = setTimeout(function () {
          if (!activeChannelObj || activeChannelUrl !== failedChannel.url) return;
          stepChannel(1, true);
        }, 900);
      }

      function advanceAutoFallback(channel, nextStageIdx) {
        if (!activeChannelObj || activeChannelUrl !== channel.url) return;
        var stages = buildFallbackStages(channel);
        if (nextStageIdx >= stages.length) {
          channel.isDead = true;
          clearSavedChannelMode(channel.url);
          if (window.location.protocol === "https:" && isHttpOnlyStream(channel.url) && isHttpProxyCapReached()) {
            setStatus("5GB HTTP Proxy Cap Reached", "error");
            return;
          }
          triggerAutoSkipToNextChannel(channel);
          return;
        }
        currentFallbackStage = nextStageIdx;
        var stage = stages[nextStageIdx];
        var streamUrl = getPlayableUrl(channel.url, stage.proxy, !!stage.allowHttp);

        if (stage.type === "hw") {
          startHardwarePlayback(streamUrl, channel, stage.proxy, 0, true, nextStageIdx, stage.key);
        } else {
          startMseFallbackPlayback(streamUrl, channel, stage.proxy, -1, stage.cap, true, nextStageIdx, stage.key);
        }
      }

      function startHardwarePlayback(streamUrl, channel, isProxyFallback, hwRecoveryAttempt, isAutoChain, stageIdx, stageKey) {
        teardownPlayer();
        clearFallbackTimer();
        currentEngineMode = "hw";
        var recoveryCount = hwRecoveryAttempt || 0;
        var inChain = !!isAutoChain;
        var myStage = typeof stageIdx === "number" ? stageIdx : 0;
        var myStageKey = stageKey || (isProxyFallback ? "hw-proxy" : "hw-direct");
        var hwStallEpisodes = 0;
        var hwBootTimestamp = 0;

        populateQualityDropdown([], true);
        setStatus(
          inChain
            ? (myStage === 0
                ? (isProxyFallback ? "Auto: HW Proxy..." : "Auto: HW Native...")
                : "Auto Try " + (myStage + 1) + ": " + (isProxyFallback ? "HW Proxy..." : "HW Native..."))
            : (recoveryCount > 0 ? "Reconnecting HW (" + recoveryCount + ")..." :
              (isProxyFallback ? "Connecting (HW Proxy)..." : "Connecting (HW)...")),
          "warn"
        );

        video.preload = "auto";
        video.src = recoveryCount > 0 ? appendCacheBuster(streamUrl) : streamUrl;

        var hardwareBooted = false;

        // Boot timeout: if HW Native hasn't loaded metadata within 4s in auto-chain, switch immediately
        if (inChain) {
          fallbackChainTimer = setTimeout(function () {
            if (!hardwareBooted && activeChannelObj && activeChannelUrl === channel.url) {
              advanceAutoFallback(channel, myStage + 1);
            }
          }, 4000);
        }

        video.onloadedmetadata = function () {
          hardwareBooted = true;
          hwBootTimestamp = Date.now();
          autoSkipHopCount = 0;
          clearAutoSkipTimer();
          clearFallbackTimer();
          stallCount = 0;
          saveChannelWinningMode(channel.url, myStageKey);
          setStatus(isProxyFallback ? "Live (Auto • HW Proxy)" : "Live (Auto • HW Native)", "ok");
          nudgeHardwareVideoPlane();
          safeVideoPlay();
        };

        video.onplaying = function () {
          nudgeHardwareVideoPlane();
          if (!hardwareBooted) {
            hwBootTimestamp = Date.now();
          }
          hardwareBooted = true;
          autoSkipHopCount = 0;
          clearAutoSkipTimer();
          clearFallbackTimer();
          stallCount = 0;
          saveChannelWinningMode(channel.url, myStageKey);
          setStatus(isProxyFallback ? "Live (Auto • HW Proxy)" : "Live (Auto • HW Native)", "ok");
        };

        video.onwaiting = function () {
          if (hardwareBooted) {
            setStatus("Buffering...", "warn");
            // Jump slightly forward if buffered data already exists ahead
            try {
              if (video.buffered && video.buffered.length > 0) {
                var bEnd = video.buffered.end(video.buffered.length - 1);
                if (bEnd - video.currentTime > 0.35) {
                  video.currentTime = bEnd - 0.15;
                }
              }
            } catch (e) {}
          }
        };

        video.onended = function () {
          if (activeChannelObj && activeChannelUrl === channel.url) {
            startHardwarePlayback(streamUrl, channel, isProxyFallback, recoveryCount + 1, inChain, myStage, myStageKey);
          }
        };

        video.onerror = function () {
          clearFallbackTimer();
          if (inChain) {
            advanceAutoFallback(channel, myStage + 1);
            return;
          }
          if (!isProxyFallback && streamUrl.indexOf("/api/proxy") !== 0) {
            startHardwarePlayback(getPlayableUrl(channel.url, true), channel, true, 0, false, 0, "hw-proxy");
            return;
          }
          if (typeof Hls !== "undefined" && Hls.isSupported()) {
            startMseFallbackPlayback(getPlayableUrl(channel.url, false), channel, false, -1, 720, false, 0, "cap-720");
          } else {
            channel.isDead = true;
            triggerAutoSkipToNextChannel(channel);
          }
        };

        safeVideoPlay();

        /* Fast Anti-Buffer Watchdog for Hardware Pipeline (checks every 1.5s) */
        clearInterval(stallWatchdogTimer);
        stallCount = 0;
        lastPlaybackTime = 0;

        stallWatchdogTimer = setInterval(function () {
          if (!activeChannelObj || activeChannelUrl !== channel.url) return;

          if (!hardwareBooted) {
            stallCount++;
            if (stallCount >= 3) {
              clearInterval(stallWatchdogTimer);
              clearFallbackTimer();
              if (inChain) {
                advanceAutoFallback(channel, myStage + 1);
              } else if (typeof Hls !== "undefined" && Hls.isSupported()) {
                startMseFallbackPlayback(getPlayableUrl(channel.url, false), channel, false, -1, 720, false, 0, "cap-720");
              } else {
                startHardwarePlayback(streamUrl, channel, isProxyFallback, recoveryCount + 1, false, 0, myStageKey);
              }
            }
            return;
          }

          if (video.paused) return;

          var nowTime = video.currentTime;
          var hasNoVideoFrame = (video.readyState < 2 || video.videoWidth === 0);

          if (Math.abs(nowTime - lastPlaybackTime) < 0.15 || hasNoVideoFrame) {
            stallCount++;
            setStatus("Buffering (" + Math.round(stallCount * 1.5) + "s)...", "warn");

            if (video.buffered && video.buffered.length > 0) {
              var bufEnd = video.buffered.end(video.buffered.length - 1);
              if (bufEnd - nowTime > 0.25) {
                try { video.currentTime = bufEnd - 0.1; } catch (e) {}
              }
            }

            // Switch to deep-buffered MSE mode after 3s stall so video stops freezing
            if (stallCount >= 2) {
              hwStallEpisodes++;
              clearInterval(stallWatchdogTimer);
              if (inChain) {
                // Overwrite saved mode so this channel won't re-pick laggy HW mode next time
                clearSavedChannelMode(channel.url);
                advanceAutoFallback(channel, myStage + 1);
              } else if (typeof Hls !== "undefined" && Hls.isSupported()) {
                startMseFallbackPlayback(getPlayableUrl(channel.url, isProxyFallback), channel, isProxyFallback, -1, 720, false, 0, "cap-720");
              } else {
                startHardwarePlayback(streamUrl, channel, isProxyFallback, recoveryCount + 1, false, 0, myStageKey);
              }
            }
          } else {
            if (stallCount > 0) {
              hwStallEpisodes++;
              // If HW mode buffers repeatedly within 25s of booting, auto-migrate to deep-buffered MSE
              if (inChain && hwStallEpisodes >= 2 && (Date.now() - hwBootTimestamp) < 25000) {
                clearInterval(stallWatchdogTimer);
                clearSavedChannelMode(channel.url);
                advanceAutoFallback(channel, myStage + 1);
                return;
              }
              setStatus(isProxyFallback ? "Live (Auto • HW Proxy)" : "Live (Auto • HW Native)", "ok");
            }
            stallCount = 0;
          }
          lastPlaybackTime = nowTime;
        }, 1500);
      }

      /* Deep-Buffered Anti-Buffer MSE Playback */
      function startMseFallbackPlayback(streamUrl, channel, isRetry, forcedLevel, capMaxHeight, isAutoChain, stageIdx, stageKey) {
        teardownPlayer();
        clearFallbackTimer();
        currentEngineMode = "mse";
        var inChain = !!isAutoChain;
        var myStage = typeof stageIdx === "number" ? stageIdx : 0;
        var myStageKey = stageKey || (capMaxHeight === 720 ? "cap-720" : (capMaxHeight === 480 ? "cap-480" : "mse-auto"));
        var mseStallEpisodes = 0;

        if (typeof Hls === "undefined" || !Hls.isSupported()) {
          if (inChain) {
            advanceAutoFallback(channel, myStage + 1);
          } else if (supportsNativeHls) {
            startHardwarePlayback(streamUrl, channel, isRetry, 0, false, 0, "hw-direct");
          } else {
            setStatus("HLS Unsupported", "error");
          }
          return;
        }

        var activeCap = typeof capMaxHeight === "number" ? capMaxHeight : 0;
        var mseBooted = false;

        if (inChain) {
          var stageLabel = activeCap === 720 ? "720p Cap" : (activeCap === 480 ? "480p Smooth" : (isRetry ? "ABR Proxy" : "ABR Auto"));
          setStatus(myStage === 0 ? ("Auto: " + stageLabel + "...") : ("Auto Try " + (myStage + 1) + ": " + stageLabel + "..."), "warn");
          fallbackChainTimer = setTimeout(function () {
            if (!mseBooted && activeChannelObj && activeChannelUrl === channel.url) {
              advanceAutoFallback(channel, myStage + 1);
            }
          }, 5000);
        }

        var baseOriginDir = channel.url.substring(0, channel.url.lastIndexOf("/") + 1);
        var baseOriginHost = "";
        try {
          var mHost = channel.url.match(/^(https?:\/\/[^\/]+)/i);
          if (mHost) baseOriginHost = mHost[1];
        } catch (e) {}

        hls = new Hls({
          enableWorker: false,
          // Start at lowest bitrate (0) for instant buffer fill, then smoothly step up
          startLevel: typeof forcedLevel === "number" && forcedLevel >= 0 ? forcedLevel : 0,
          autoStartLoad: true,
          startFragPrefetch: true,
          capLevelToPlayerSize: false,
          // Deep anti-buffer cushion (30s target, 60s max, 4 segments behind live edge)
          maxBufferLength: 30,
          maxMaxBufferLength: 60,
          backBufferLength: 15,
          maxBufferHole: 1.5,
          nudgeOffset: 0.2,
          nudgeMaxRetry: 6,
          liveSyncDurationCount: 4,
          liveMaxLatencyDurationCount: 12,
          // Conservative ABR so it never over-estimates bandwidth and stalls
          abrBandWidthFactor: 0.70,
          abrBandWidthUpFactor: 0.50,
          abrMaxWithRealBitrate: true,
          fragLoadingTimeOut: 12000,
          fragLoadingMaxRetry: 4,
          fragLoadingRetryDelay: 500,
          manifestLoadingTimeOut: 8000,
          manifestLoadingMaxRetry: 3,
          xhrSetup: function (xhr, reqUrl) {
            var low = String(reqUrl || "").toLowerCase();
            var isOnDemandHttp = (window.location.protocol === "https:" && isHttpOnlyStream(channel.url));
            var isSegment = (low.indexOf(".ts") !== -1 || low.indexOf(".m4s") !== -1 || low.indexOf(".mp4") !== -1 || low.indexOf(".aac") !== -1);

            // For normal HTTPS streams, NEVER allow heavy video chunks to pass through Vercel /api/proxy
            if (!isOnDemandHttp && isSegment && low.indexOf("/api/proxy") !== -1) {
              var directSegUrl = reqUrl;
              var qIdx = reqUrl.indexOf("url=");
              if (qIdx !== -1) {
                directSegUrl = decodeURIComponent(reqUrl.substring(qIdx + 4).split("&")[0]);
              } else {
                var filePart = reqUrl.replace(/^https?:\/\/[^\/]+\/api\//i, "").replace(/^https?:\/\/[^\/]+\//i, "");
                directSegUrl = (filePart.charAt(0) === "/" && baseOriginHost) ? (baseOriginHost + filePart) : (baseOriginDir + filePart);
              }
              xhr.open("GET", directSegUrl, true);
            }
          }
        });

        hls.loadSource(streamUrl);
        hls.attachMedia(video);

        hls.on(Hls.Events.FRAG_LOADED, function (event, data) {
          if (data && data.stats) {
            var loaded = data.stats.loaded || 0;
            var tMs = (data.stats.tload && data.stats.trequest) ? (data.stats.tload - data.stats.trequest) : 0;
            var inst = (loaded > 0 && tMs > 5) ? ((loaded * 8) / ((tMs / 1000) * 1000000)) : 0;
            var isProxiedHttp = (window.location.protocol === "https:" && isHttpOnlyStream(channel.url));
            recordDownloadedBytes(loaded, inst, isProxiedHttp);
          }
        });

        hls.on(Hls.Events.MANIFEST_PARSED, function (event, data) {
          mseBooted = true;
          autoSkipHopCount = 0;
          clearAutoSkipTimer();
          clearFallbackTimer();
          saveChannelWinningMode(channel.url, myStageKey);
          var levels = (data && data.levels) ? data.levels : [];
          var prefix = inChain ? "Auto • " : "";
          if (activeCap > 0 && levels.length > 0) {
            var cappedIdx = pickBestLevelForCap(levels, activeCap);
            hls.autoLevelCapping = cappedIdx;
            hls.currentLevel = cappedIdx;
            var capH = (levels[cappedIdx] && levels[cappedIdx].height) ? levels[cappedIdx].height + "p" : activeCap + "p";
            populateQualityDropdown(levels, false);
            setStatus("Live (" + prefix + capH + " Cap)", "ok");
          } else if (typeof forcedLevel === "number" && forcedLevel >= 0 && levels.length > forcedLevel) {
            hls.currentLevel = forcedLevel;
            var lockH = (levels[forcedLevel] && levels[forcedLevel].height) ? levels[forcedLevel].height + "p" : "Locked";
            populateQualityDropdown(levels, false);
            setStatus("Live (" + lockH + ")", "ok");
          } else {
            populateQualityDropdown(levels, false);
            setStatus(streamUrl.indexOf("/api/proxy") === 0 ? ("Live (" + prefix + "ABR Proxy)") : ("Live (" + prefix + "ABR Auto)"), "ok");
          }
          nudgeHardwareVideoPlane();
          safeVideoPlay();
        });

        hls.on(Hls.Events.LEVEL_SWITCHED, function (event, data) {
          if (!hls || !hls.levels || !hls.levels[data.level]) return;
          var h = hls.levels[data.level].height;
          if (h) {
            var prefix = inChain ? "Auto • " : "";
            setStatus(activeCap > 0 ? "Live (" + prefix + h + "p Cap)" : "Live (" + prefix + h + "p)", "ok");
          }
        });

        hls.on(Hls.Events.ERROR, function (event, data) {
          // Non-fatal buffer stall: immediately drop one quality level & jump buffer gap
          if (!data.fatal) {
            if (data.details === Hls.ErrorDetails.BUFFER_STALLED_ERROR || data.details === Hls.ErrorDetails.BUFFER_NUDGE_ON_STALL) {
              setStatus("Smoothing Buffer...", "warn");
              if (hls && hls.levels && hls.levels.length > 1 && hls.currentLevel > 0) {
                var lowerLvl = Math.max(0, hls.currentLevel - 1);
                hls.autoLevelCapping = lowerLvl;
                hls.currentLevel = lowerLvl;
              }
              try {
                if (video.buffered && video.buffered.length > 0) {
                  var bEnd = video.buffered.end(video.buffered.length - 1);
                  if (bEnd - video.currentTime > 0.25) {
                    video.currentTime = bEnd - 0.1;
                  }
                }
              } catch (e) {}
            }
            return;
          }

          clearFallbackTimer();

          if (inChain) {
            advanceAutoFallback(channel, myStage + 1);
            return;
          }

          if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
            hls.recoverMediaError();
            return;
          }

          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
            if (!isRetry && streamUrl.indexOf("/api/proxy") !== 0) {
              startMseFallbackPlayback(getPlayableUrl(channel.url, true), channel, true, forcedLevel, activeCap, false, 0, "mse-proxy");
              return;
            }
            setStatus("Reconnecting...", "warn");
            setTimeout(function () {
              if (hls && activeChannelUrl === channel.url) {
                hls.startLoad();
              }
            }, 1200);
            return;
          }

          if (supportsNativeHls) {
            startHardwarePlayback(streamUrl, channel, isRetry, 0, false, 0, "hw-direct");
          } else {
            channel.isDead = true;
            triggerAutoSkipToNextChannel(channel);
          }
        });

        clearInterval(stallWatchdogTimer);
        stallCount = 0;
        lastPlaybackTime = 0;
        stallWatchdogTimer = setInterval(function () {
          if (!hls || !activeChannelObj || activeChannelUrl !== channel.url) return;
          if (video.paused || video.ended) return;
          var nowTime = video.currentTime;
          if (Math.abs(nowTime - lastPlaybackTime) < 0.15) {
            stallCount++;
            setStatus("Buffering (" + Math.round(stallCount * 1.5) + "s)...", "warn");

            // Jump forward if buffered segments are waiting ahead
            try {
              if (video.buffered && video.buffered.length > 0) {
                var bufEnd = video.buffered.end(video.buffered.length - 1);
                if (bufEnd - nowTime > 0.25) {
                  video.currentTime = bufEnd - 0.1;
                }
              }
            } catch (e) {}

            // On first 1.5s stall: immediately cap down to lower quality & reload
            if (stallCount === 1) {
              mseStallEpisodes++;
              if (hls.levels && hls.levels.length > 1 && hls.currentLevel > 0) {
                var stepDown = Math.max(0, hls.currentLevel - 1);
                hls.autoLevelCapping = stepDown;
                hls.currentLevel = stepDown;
              }
              hls.startLoad();
            } else if (stallCount >= 3) {
              stallCount = 0;
              if (inChain) {
                clearInterval(stallWatchdogTimer);
                clearSavedChannelMode(channel.url);
                advanceAutoFallback(channel, myStage + 1);
              } else {
                hls.recoverMediaError();
                hls.startLoad();
              }
            }
          } else {
            if (stallCount > 0) {
              var hNow = (hls.levels && hls.currentLevel >= 0 && hls.levels[hls.currentLevel] && hls.levels[hls.currentLevel].height)
                ? hls.levels[hls.currentLevel].height + "p"
                : "Auto";
              setStatus("Live (" + hNow + ")", "ok");
            }
            stallCount = 0;
          }
          lastPlaybackTime = nowTime;
        }, 1500);
      }

      function startPlayback(streamUrl, channel) {
        clearFallbackTimer();
        var isOnDemandHttp = (window.location.protocol === "https:" && isHttpOnlyStream(channel.url));
        if (isOnDemandHttp || preferredQualityMode === "smart-auto") {
          activeAutoChainMode = true;
          advanceAutoFallback(channel, 0);
          return;
        }
        if (preferredQualityMode === "hw") {
          activeAutoChainMode = false;
          startHardwarePlayback(streamUrl, channel, false, 0, false, 0, "hw-direct");
        } else if (preferredQualityMode === "cap-720") {
          activeAutoChainMode = false;
          startMseFallbackPlayback(streamUrl, channel, false, -1, 720, false, 0, "cap-720");
        } else if (preferredQualityMode === "cap-480") {
          activeAutoChainMode = false;
          startMseFallbackPlayback(streamUrl, channel, false, -1, 480, false, 0, "cap-480");
        } else if (preferredQualityMode === "mse-auto") {
          activeAutoChainMode = false;
          startMseFallbackPlayback(streamUrl, channel, false, -1, 0, false, 0, "mse-auto");
        } else {
          activeAutoChainMode = true;
          advanceAutoFallback(channel, 0);
        }
      }

      function updateActiveCardHighlight() {
        var cards = channelListEl.querySelectorAll(".channel-card");
        for (var i = 0; i < cards.length; i++) {
          var cardUrl = cards[i].getAttribute("data-url");
          if (cardUrl === activeChannelUrl) {
            addClass(cards[i], "active");
          } else {
            removeClass(cards[i], "active");
          }
        }
      }

      function playChannel(channel, isAutoSkip) {
        if (!channel) return;
        clearAutoSkipTimer();
        if (!isAutoSkip) {
          autoSkipHopCount = 0;
        }
        activeChannelUrl = channel.url;
        activeChannelObj = channel;

        var isOnDemandHttp = (window.location.protocol === "https:" && isHttpOnlyStream(channel.url));

        // Do not save HTTP-only channels as the auto-start channel on next visit
        if (!isOnDemandHttp) {
          try {
            localStorage.setItem(STORAGE_LAST_URL, channel.url);
          } catch (e) {}
        }

        currentLogo.src = channel.logo;
        currentLogo.onerror = function () { currentLogo.onerror = null; currentLogo.src = FALLBACK_LOGO; };
        currentTitle.textContent = "#" + channel.num + "  " + channel.name;
        currentCategory.textContent = isOnDemandHttp ? (channel.group + " • HTTP Proxy") : channel.group;

        updateActiveCardHighlight();

        if (isOnDemandHttp && isHttpProxyCapReached()) {
          teardownPlayer();
          setStatus("5GB HTTP Proxy Cap Reached", "error");
          return;
        }

        var streamUrl = getPlayableUrl(channel.url, isOnDemandHttp, isOnDemandHttp);
        startPlayback(streamUrl, channel);
      }

      function stepChannel(delta, isAutoSkip) {
        var list = filteredChannels.length > 0 ? filteredChannels : channels;
        if (list.length === 0) return;

        var idx = -1;
        for (var i = 0; i < list.length; i++) {
          if (list[i].url === activeChannelUrl) {
            idx = i;
            break;
          }
        }
        var nextIdx = idx === -1 ? 0 : (idx + delta + list.length) % list.length;

        // When auto-skipping, jump over channels already flagged dead if healthy ones remain
        if (isAutoSkip && list.length > 1) {
          for (var step = 0; step < list.length; step++) {
            var candidateIdx = (nextIdx + step * (delta >= 0 ? 1 : -1) + list.length) % list.length;
            if (!list[candidateIdx].isDead) {
              nextIdx = candidateIdx;
              break;
            }
          }
        }

        playChannel(list[nextIdx], !!isAutoSkip);
      }

      function appendChannelBatch() {
        var existingBtn = document.getElementById("loadMoreChannelsBtn");
        if (existingBtn && existingBtn.parentNode) {
          existingBtn.parentNode.removeChild(existingBtn);
        }

        var end = Math.min(renderedCount + BATCH_SIZE, filteredChannels.length);
        var fragment = document.createDocumentFragment();

        for (var i = renderedCount; i < end; i++) {
          (function (ch, index) {
            var card = document.createElement("div");
            card.className = "channel-card" + (ch.url === activeChannelUrl ? " active" : "");
            card.setAttribute("tabindex", "0");
            card.setAttribute("data-index", index);
            card.setAttribute("data-url", ch.url);

            var img = document.createElement("img");
            img.loading = "lazy";
            img.decoding = "async";
            img.src = ch.logo;
            img.alt = "";
            img.onerror = function () { this.onerror = null; this.src = FALLBACK_LOGO; };

            var infoDiv = document.createElement("div");
            infoDiv.className = "channel-info";

            var nameDiv = document.createElement("div");
            nameDiv.className = "channel-name";
            nameDiv.textContent = ch.num + ". " + ch.name;

            var groupDiv = document.createElement("div");
            groupDiv.className = "channel-group";
            groupDiv.textContent = ch.isHttpOnly ? (ch.group + " • HTTP") : ch.group;

            infoDiv.appendChild(nameDiv);
            infoDiv.appendChild(groupDiv);

            var favBtn = document.createElement("button");
            favBtn.type = "button";
            var favActive = isChannelFavorite(ch.url);
            favBtn.className = "fav-btn" + (favActive ? " is-fav" : "");
            favBtn.title = favActive ? "Remove from Favourites" : "Add to Favourites";
            favBtn.textContent = favActive ? "★" : "☆";
            favBtn.addEventListener("click", function (ev) {
              if (ev && ev.stopPropagation) ev.stopPropagation();
              toggleChannelFavorite(ch.url);
              var nowFav = isChannelFavorite(ch.url);
              favBtn.textContent = nowFav ? "★" : "☆";
              favBtn.title = nowFav ? "Remove from Favourites" : "Add to Favourites";
              if (nowFav) {
                addClass(favBtn, "is-fav");
              } else {
                removeClass(favBtn, "is-fav");
              }
            });

            card.appendChild(img);
            card.appendChild(infoDiv);
            card.appendChild(favBtn);

            card.addEventListener("click", function () {
              if (video.muted) video.muted = false;
              playChannel(ch);
            });
            fragment.appendChild(card);
          })(filteredChannels[i], i);
        }

        renderedCount = end;
        channelListEl.appendChild(fragment);

        if (renderedCount < filteredChannels.length) {
          var moreBtn = document.createElement("button");
          moreBtn.id = "loadMoreChannelsBtn";
          moreBtn.className = "secondary load-more-btn";
          moreBtn.textContent = "Load More (" + (filteredChannels.length - renderedCount) + " remaining)";
          moreBtn.addEventListener("click", function () {
            appendChannelBatch();
          });
          channelListEl.appendChild(moreBtn);
        }
      }

      function renderChannels() {
        filteredChannels = [];
        var q = searchQuery.replace(/^\s+|\s+$/g, "").toLowerCase();
        var isSearchingAll = q.length > 0;

        for (var k = 0; k < channels.length; k++) {
          var chItem = channels[k];
          var matchesSearch = !isSearchingAll || chItem.name.toLowerCase().indexOf(q) !== -1;
          if (!matchesSearch) continue;

          if (isSearchingAll) {
            filteredChannels.push(chItem);
            continue;
          }

          var matchesCat = false;
          if (activeCategory === HTTP_TAB_NAME) {
            matchesCat = !!chItem.isHttpOnly;
          } else if (activeCategory === FAVORITES_TAB_NAME) {
            matchesCat = isChannelFavorite(chItem.url);
          } else if (chItem.isHttpOnly) {
            matchesCat = false;
          } else if (activeCategory === NEWS_TAB_NAME) {
            matchesCat = !!chItem.isNews;
          } else if (activeCategory === KOLKATA_TAB_NAME) {
            matchesCat = !!chItem.isKolkata;
          } else if (activeCategory === HINDI_MOVIES_TAB_NAME) {
            matchesCat = !!chItem.isHindiMovies;
          } else if (activeCategory === MUSIC_TAB_NAME) {
            matchesCat = !!chItem.isMusic;
          } else if (activeCategory === "All") {
            matchesCat = true;
          } else {
            matchesCat = (chItem.group === activeCategory);
          }
          if (matchesCat) {
            filteredChannels.push(chItem);
          }
        }

        if (!isSearchingAll) {
          if (activeCategory === NEWS_TAB_NAME) {
            filteredChannels.sort(function (a, b) {
              var rankA = (typeof a.newsRank === "number") ? a.newsRank : 9999;
              var rankB = (typeof b.newsRank === "number") ? b.newsRank : 9999;
              return rankA - rankB;
            });
          } else if (activeCategory === KOLKATA_TAB_NAME) {
            filteredChannels.sort(function (a, b) {
              var rankA = (typeof a.kolkataRank === "number") ? a.kolkataRank : 9999;
              var rankB = (typeof b.kolkataRank === "number") ? b.kolkataRank : 9999;
              return rankA - rankB;
            });
          } else if (activeCategory === HINDI_MOVIES_TAB_NAME) {
            filteredChannels.sort(function (a, b) {
              var rankA = (typeof a.hindiMoviesRank === "number") ? a.hindiMoviesRank : 9999;
              var rankB = (typeof b.hindiMoviesRank === "number") ? b.hindiMoviesRank : 9999;
              return rankA - rankB;
            });
          } else if (activeCategory === MUSIC_TAB_NAME) {
            filteredChannels.sort(function (a, b) {
              var rankA = (typeof a.musicRank === "number") ? a.musicRank : 9999;
              var rankB = (typeof b.musicRank === "number") ? b.musicRank : 9999;
              return rankA - rankB;
            });
          }
        }

        if (activeCategoryLabel) {
          activeCategoryLabel.textContent = isSearchingAll ? ("Search: All Channels") : activeCategory;
        }
        channelCount.textContent = filteredChannels.length + " channels";
        channelListEl.innerHTML = "";
        channelListEl.scrollTop = 0;
        renderedCount = 0;

        if (filteredChannels.length === 0 && activeCategory === FAVORITES_TAB_NAME) {
          var emptyDiv = document.createElement("div");
          emptyDiv.className = "empty-list-msg";
          emptyDiv.textContent = "No favourite channels yet. Tap the ☆ star on any channel card to save it here.";
          channelListEl.appendChild(emptyDiv);
          return;
        }

        appendChannelBatch();
      }

      channelListEl.addEventListener("scroll", function () {
        if (renderedCount >= filteredChannels.length) return;
        if (channelListEl.scrollTop + channelListEl.clientHeight >= channelListEl.scrollHeight - 160) {
          appendChannelBatch();
        }
      }, { passive: true });

      /* LG Magic Remote & Keyboard Navigation */
      document.addEventListener("keydown", function (e) {
        var key = e.keyCode || e.which;
        var activeEl = document.activeElement;
        var isTyping = activeEl && (activeEl.tagName === "INPUT" || activeEl.tagName === "SELECT");

        if (video.muted) {
          video.muted = false;
        }

        // LG TV Remote Channel Up (427 / PageUp 33) & Channel Down (428 / PageDown 34)
        if (!isTyping && (key === 427 || key === 33)) {
          e.preventDefault();
          stepChannel(-1);
          return;
        }
        if (!isTyping && (key === 428 || key === 34)) {
          e.preventDefault();
          stepChannel(1);
          return;
        }

        if (!isTyping && (key === 70 || key === 102)) {
          e.preventDefault();
          toggleFullDisplay();
          return;
        }

        if (key === 461 || key === 27) {
          if (isFullDisplay) {
            e.preventDefault();
            toggleFullDisplay();
            return;
          }
          return;
        }

        if (activeEl && hasClass(activeEl, "channel-card")) {
          var idx = parseInt(activeEl.getAttribute("data-index"), 10);
          var cards = channelListEl.querySelectorAll(".channel-card");

          if (key === 13) {
            e.preventDefault();
            activeEl.click();
          } else if (key === 39) {
            e.preventDefault();
            if (idx + 1 >= renderedCount && renderedCount < filteredChannels.length) {
              appendChannelBatch();
              cards = channelListEl.querySelectorAll(".channel-card");
            }
            if (cards[idx + 1]) cards[idx + 1].focus();
          } else if (key === 37) {
            e.preventDefault();
            if (cards[idx - 1]) cards[idx - 1].focus();
          } else if (key === 40) {
            e.preventDefault();
            if (idx + 2 >= renderedCount && renderedCount < filteredChannels.length) {
              appendChannelBatch();
              cards = channelListEl.querySelectorAll(".channel-card");
            }
            if (cards[idx + 2]) cards[idx + 2].focus();
          } else if (key === 38) {
            e.preventDefault();
            if (idx - 2 >= 0 && cards[idx - 2]) {
              cards[idx - 2].focus();
            } else {
              var activeTab = categoryTabs.querySelector(".tab.active") || categoryTabs.querySelector(".tab");
              if (activeTab) activeTab.focus();
            }
          }
          return;
        }

        if (activeEl && hasClass(activeEl, "tab")) {
          var tabs = Array.prototype.slice.call(categoryTabs.querySelectorAll(".tab"));
          var tIdx = tabs.indexOf(activeEl);
          if (key === 39 && tabs[tIdx + 1]) {
            e.preventDefault();
            tabs[tIdx + 1].focus();
          } else if (key === 37 && tabs[tIdx - 1]) {
            e.preventDefault();
            tabs[tIdx - 1].focus();
          } else if (key === 40) {
            e.preventDefault();
            var firstCard = channelListEl.querySelector(".channel-card.active") || channelListEl.querySelector(".channel-card");
            if (firstCard) firstCard.focus();
          } else if (key === 13) {
            e.preventDefault();
            activeEl.click();
          }
        }
      });

      categoryTabs.addEventListener("click", function (e) {
        if (!hasClass(e.target, "tab")) return;
        var allTabs = categoryTabs.querySelectorAll(".tab");
        for (var i = 0; i < allTabs.length; i++) removeClass(allTabs[i], "active");
        addClass(e.target, "active");
        activeCategory = e.target.getAttribute("data-category");
        syncFavButtonState();
        renderChannels();
      });

      if (favFilterBtn) {
        favFilterBtn.addEventListener("click", function () {
          var allTabs = categoryTabs.querySelectorAll(".tab");
          if (activeCategory === FAVORITES_TAB_NAME) {
            activeCategory = NEWS_TAB_NAME;
            for (var i = 0; i < allTabs.length; i++) {
              if (allTabs[i].getAttribute("data-category") === NEWS_TAB_NAME) {
                addClass(allTabs[i], "active");
              } else {
                removeClass(allTabs[i], "active");
              }
            }
          } else {
            for (var j = 0; j < allTabs.length; j++) removeClass(allTabs[j], "active");
            activeCategory = FAVORITES_TAB_NAME;
          }
          syncFavButtonState();
          renderChannels();
        });
      }

      var searchDebounceTimer = null;
      searchInput.addEventListener("input", function (e) {
        var val = e.target.value;
        clearTimeout(searchDebounceTimer);
        searchDebounceTimer = setTimeout(function () {
          searchQuery = val;
          renderChannels();
        }, 120);
      });

      clearSearchBtn.addEventListener("click", function () {
        searchInput.value = "";
        searchQuery = "";
        renderChannels();
      });

      prevChBtn.addEventListener("click", function () {
        if (video.muted) video.muted = false;
        stepChannel(-1);
      });

      nextChBtn.addEventListener("click", function () {
        if (video.muted) video.muted = false;
        stepChannel(1);
      });

      function initializeStartupPlayback() {
        var savedUrl = null;
        try { savedUrl = localStorage.getItem(STORAGE_LAST_URL); } catch (e) {}

        var startChannel = null;
        if (savedUrl) {
          for (var i = 0; i < channels.length; i++) {
            if (channels[i].url === savedUrl) {
              startChannel = channels[i];
              break;
            }
          }
        }
        if (!startChannel) {
          startChannel = filteredChannels.length > 0 ? filteredChannels[0] : channels[0];
        }
        if (startChannel) {
          playChannel(startChannel);
        }
      }

      function tagNewsChannels(list) {
        var i, s;
        var usedUrls = {};

        for (i = 0; i < list.length; i++) {
          list[i].isNews = false;
          list[i].newsRank = 9999;
        }

        // Precompute normalized title and TV playability score once
        var meta = [];
        for (i = 0; i < list.length; i++) {
          meta.push({
            norm: normalizeChannelTitle(list[i].name),
            score: scoreTvPlayability(list[i])
          });
        }

        // Pick the single best available stream for each of the 30 requested channels
        for (s = 0; s < NEWS_SLOTS.length; s++) {
          var keywords = NEWS_SLOTS[s];
          var bestIdx = -1;
          var bestScore = -99999;

          for (i = 0; i < list.length; i++) {
            if (list[i].isNews || usedUrls[list[i].url] || list[i].isHttpOnly) continue;
            if (meta[i].score < -50 || isUnreliableVariant(list[i], meta[i].norm)) continue;

            // Avoid false cross-matches between "BTV" and "BTV News" / "BTV Chittagong"
            if (keywords[0] === "btv national" && (meta[i].norm.indexOf(" news ") !== -1 || meta[i].norm.indexOf(" chittagong ") !== -1 || meta[i].norm.indexOf(" chattogram ") !== -1)) {
              continue;
            }
            // Avoid matching "Channel 1" against "Channel 10", "Channel 11", etc. (matchesSlotKeywords checks space-padded tokens, so " channel 1 " is exact)
            if (matchesSlotKeywords(meta[i].norm, keywords)) {
              if (meta[i].score > bestScore) {
                bestScore = meta[i].score;
                bestIdx = i;
              }
            }
          }

          if (bestIdx !== -1) {
            list[bestIdx].isNews = true;
            list[bestIdx].newsRank = s + 1;
            usedUrls[list[bestIdx].url] = true;
          }
        }
      }

      function tagKolkataChannels(list) {
        var i, s;
        var usedUrls = {};

        for (i = 0; i < list.length; i++) {
          list[i].isKolkata = false;
          list[i].kolkataRank = 9999;
        }

        var meta = [];
        for (i = 0; i < list.length; i++) {
          meta.push({
            norm: normalizeChannelTitle(list[i].name),
            score: scoreTvPlayability(list[i])
          });
        }

        for (s = 0; s < KOLKATA_SLOTS.length; s++) {
          var keywords = KOLKATA_SLOTS[s];
          var bestIdx = -1;
          var bestScore = -99999;

          for (i = 0; i < list.length; i++) {
            if (list[i].isKolkata || usedUrls[list[i].url] || list[i].isHttpOnly) continue;
            if (meta[i].score < -50 || isUnreliableVariant(list[i], meta[i].norm)) continue;

            // Prevent "Star Jalsha" from matching "Star Jalsha Movies"
            if (keywords[0] === "star jalsha" && meta[i].norm.indexOf(" movies ") !== -1) {
              continue;
            }
            // Prevent "Zee Bangla" from matching "Zee Bangla Cinema" or "Zee Bangla Sonar"
            if (keywords[0] === "zee bangla" && (meta[i].norm.indexOf(" cinema ") !== -1 || meta[i].norm.indexOf(" sonar ") !== -1)) {
              continue;
            }
            // Prevent "Colors Bangla" from matching "Colors Bangla Cinema"
            if (keywords[0] === "colors bangla" && meta[i].norm.indexOf(" cinema ") !== -1) {
              continue;
            }

            if (matchesSlotKeywords(meta[i].norm, keywords)) {
              if (meta[i].score > bestScore) {
                bestScore = meta[i].score;
                bestIdx = i;
              }
            }
          }

          if (bestIdx !== -1) {
            list[bestIdx].isKolkata = true;
            list[bestIdx].kolkataRank = s + 1;
            usedUrls[list[bestIdx].url] = true;
          }
        }
      }

      function tagHindiMoviesChannels(list) {
        var i, s;
        var usedUrls = {};

        for (i = 0; i < list.length; i++) {
          list[i].isHindiMovies = false;
          list[i].hindiMoviesRank = 9999;
        }

        var meta = [];
        for (i = 0; i < list.length; i++) {
          meta.push({
            norm: normalizeChannelTitle(list[i].name),
            score: scoreTvPlayability(list[i])
          });
        }

        for (s = 0; s < HINDI_MOVIES_SLOTS.length; s++) {
          var keywords = HINDI_MOVIES_SLOTS[s];
          var bestIdx = -1;
          var bestScore = -99999;

          for (i = 0; i < list.length; i++) {
            if (list[i].isHindiMovies || usedUrls[list[i].url] || list[i].isHttpOnly) continue;
            if (meta[i].score < -50 || isUnreliableVariant(list[i], meta[i].norm)) continue;

            // Prevent base "Star Gold" from matching Star Gold 2 / Select / Romance / Thrills
            if (keywords[0] === "star gold" && (
              meta[i].norm.indexOf(" 2 ") !== -1 ||
              meta[i].norm.indexOf(" select ") !== -1 ||
              meta[i].norm.indexOf(" romance ") !== -1 ||
              meta[i].norm.indexOf(" thrills ") !== -1
            )) {
              continue;
            }
            // Prevent base "Sony MAX" from matching Sony MAX 1 / Sony MAX 2
            if (keywords[0] === "sony max" && (
              meta[i].norm.indexOf(" 1 ") !== -1 ||
              meta[i].norm.indexOf(" 2 ") !== -1
            )) {
              continue;
            }
            // Prevent base "Colors Cineplex" from matching Bollywood / Superhits
            if (keywords[0] === "colors cineplex" && (
              meta[i].norm.indexOf(" bollywood ") !== -1 ||
              meta[i].norm.indexOf(" superhits ") !== -1
            )) {
              continue;
            }
            // Prevent base "Anmol Cinema" from matching Anmol Cinema 2
            if (keywords[0] === "anmol cinema" && meta[i].norm.indexOf(" 2 ") !== -1) {
              continue;
            }
            // Prevent base "Goldmines" from matching Goldmines Bollywood / Goldmines Movies
            if (keywords[0] === "goldmines" && (
              meta[i].norm.indexOf(" bollywood ") !== -1 ||
              meta[i].norm.indexOf(" movies ") !== -1
            )) {
              continue;
            }
            // Prevent "Enterr10" from matching "Enterr10 Bangla"
            if (keywords[0] === "enterr10" && meta[i].norm.indexOf(" bangla ") !== -1) {
              continue;
            }
            // Prevent "&pictures" / "pictures" from matching "Zee Pictures" or "Sony Pix"
            if (keywords[0] === "&pictures" && (
              meta[i].norm.indexOf(" zee ") !== -1 ||
              meta[i].norm.indexOf(" sony ") !== -1
            )) {
              continue;
            }

            if (matchesSlotKeywords(meta[i].norm, keywords)) {
              if (meta[i].score > bestScore) {
                bestScore = meta[i].score;
                bestIdx = i;
              }
            }
          }

          if (bestIdx !== -1) {
            list[bestIdx].isHindiMovies = true;
            list[bestIdx].hindiMoviesRank = s + 1;
            usedUrls[list[bestIdx].url] = true;
          }
        }
      }

      function tagMusicChannels(list) {
        var i, s;
        var usedUrls = {};

        for (i = 0; i < list.length; i++) {
          list[i].isMusic = false;
          list[i].musicRank = 9999;
        }

        var meta = [];
        for (i = 0; i < list.length; i++) {
          meta.push({
            norm: normalizeChannelTitle(list[i].name),
            score: scoreTvPlayability(list[i])
          });
        }

        for (s = 0; s < MUSIC_SLOTS.length; s++) {
          var keywords = MUSIC_SLOTS[s];
          var bestIdx = -1;
          var bestScore = -99999;

          for (i = 0; i < list.length; i++) {
            if (list[i].isMusic || usedUrls[list[i].url] || list[i].isHttpOnly) continue;
            if (meta[i].score < -50 || isUnreliableVariant(list[i], meta[i].norm)) continue;

            // Prevent "Zoom" from matching unrelated channels like "Zoom Sports"
            if (keywords[0] === "zoom" && meta[i].norm.indexOf(" sports ") !== -1) {
              continue;
            }

            if (matchesSlotKeywords(meta[i].norm, keywords)) {
              if (meta[i].score > bestScore) {
                bestScore = meta[i].score;
                bestIdx = i;
              }
            }
          }

          if (bestIdx !== -1) {
            list[bestIdx].isMusic = true;
            list[bestIdx].musicRank = s + 1;
            usedUrls[list[bestIdx].url] = true;
          }
        }
      }

      function loadBuiltinFallback() {
        channels = [];
        for (var idx = 0; idx < BUILTIN_CHANNELS.length; idx++) {
          var c = BUILTIN_CHANNELS[idx];
          channels.push({ num: idx + 1, name: c.name, group: c.group, logo: c.logo, url: c.url });
        }
        tagNewsChannels(channels);
        tagKolkataChannels(channels);
        tagHindiMoviesChannels(channels);
        tagMusicChannels(channels);
        activeCategory = NEWS_TAB_NAME;
        buildCategoryTabs();
        renderChannels();
        initializeStartupPlayback();
      }

      function applyParsedPlaylist(parsed, shouldStartPlayback) {
        channels = parsed;
        tagNewsChannels(channels);
        tagKolkataChannels(channels);
        tagHindiMoviesChannels(channels);
        tagMusicChannels(channels);
        if (shouldStartPlayback) {
          activeCategory = NEWS_TAB_NAME;
        }
        buildCategoryTabs();
        renderChannels();
        if (shouldStartPlayback) {
          initializeStartupPlayback();
        }
      }

      function savePlaylistCache(url, m3uText) {
        try {
          localStorage.setItem(STORAGE_PLAYLIST_CACHE, JSON.stringify({
            url: url,
            ts: Date.now(),
            text: m3uText
          }));
        } catch (e) {}
      }

      function loadPlaylistCache(url) {
        try {
          var raw = localStorage.getItem(STORAGE_PLAYLIST_CACHE);
          if (!raw) return null;
          var obj = JSON.parse(raw);
          if (obj && obj.url === url && obj.text) {
            return obj;
          }
        } catch (e) {}
        return null;
      }

      function loadM3UPlaylist(url) {
        var cached = loadPlaylistCache(url);
        var bootedFromCache = false;

        if (cached) {
          var cachedParsed = parseM3U(cached.text);
          if (cachedParsed.length > 0) {
            bootedFromCache = true;
            applyParsedPlaylist(cachedParsed, true);
          }
        }

        if (!bootedFromCache) {
          setStatus("Loading Channels...", "warn");
        }

        var xhr = new XMLHttpRequest();
        xhr.open("GET", url, true);
        xhr.timeout = 8000;

        xhr.onreadystatechange = function () {
          if (xhr.readyState === 4) {
            if (xhr.status >= 200 && xhr.status < 300 && xhr.responseText) {
              var parsed = parseM3U(xhr.responseText);
              if (parsed.length > 0) {
                var isDifferent = !cached || cached.text !== xhr.responseText;
                savePlaylistCache(url, xhr.responseText);
                if (!bootedFromCache) {
                  applyParsedPlaylist(parsed, true);
                } else if (isDifferent) {
                  // Silently refresh channel list in background without interrupting active playback
                  applyParsedPlaylist(parsed, false);
                }
                return;
              }
            }
            if (!bootedFromCache) {
              loadBuiltinFallback();
            }
          }
        };

        xhr.onerror = function () {
          if (!bootedFromCache) loadBuiltinFallback();
        };

        xhr.ontimeout = function () {
          if (!bootedFromCache) loadBuiltinFallback();
        };

        try {
          xhr.send();
        } catch (err) {
          if (!bootedFromCache) loadBuiltinFallback();
        }
      }

      loadM3UPlaylist(ACTIVE_M3U_URL);
    })();
  </script>
